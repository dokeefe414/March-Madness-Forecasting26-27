name: Deploy website to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["Archive real pre-tipoff forecasts"]
    types: [completed]
  schedule:
    # Daily 2:47 a.m. Eastern site refresh, after the in-season 2:07 archive.
    # Preserve year-round source/model/site rebuilds, including off-season.
    # GitHub cron is best-effort, not a guaranteed exact start time.
    - cron: "47 2 * * *"
      timezone: "America/New_York"
    # 6:47 a.m. Eastern in-season catch-up after the 6:07 archive:
    # late West Coast scores and delayed independent final verification.
    - cron: "47 6 * 1,2,3,4,11,12 *"
      timezone: "America/New_York"
    # GitHub-token archival commits do not themselves trigger a push workflow.
    # Backup site refreshes AFTER 9:07/16:07 archiving, and workflow_run
    # also rebuilds promptly following any successful archive job.
    - cron: "17 10,17 * 1,2,3,4,11,12 *"
      timezone: "America/New_York"
    # 22:47 ET: same-evening finals and archived picks after the 22:07
    # capture. ESPN final status can be newer than the NCAA-derived ratings.
    - cron: "47 22 * 1,2,3,4,11,12 *"
      timezone: "America/New_York"
    # Monday AP poll comparison after new AP edition snapshot at 18:07 ET.
    - cron: "47 18 * 1,2,3,4,11,12 1"
      timezone: "America/New_York"
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    # Do not republish when source capture failed: keep last honest site.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/configure-pages@v5
      - name: Build historical-only research and model-calibration artifact
        env:
          PYTHONPATH: research
        run: python -m forecast.benchmark --web-dir web --out web/public/research/benchmark.json
      - name: Publish independently audited historical training dataset and nested out-of-time evaluation
        env:
          PYTHONPATH: research
        run: python -m forecast.historical_dataset --web-dir web --manifest web/public/research/historical-data-manifest.json --evaluation web/public/research/historical-evaluation.json
      - name: Publish historical-only probabilistic score, calibration and ensemble evaluation
        env:
          PYTHONPATH: research
        run: python -m forecast.historical_probabilistic --web-dir web --out web/public/research/historical-probabilistic.json
      - name: Publish honest source-audited historical Four Factors and possession data coverage
        env:
          PYTHONPATH: research
        run: python -m forecast.historical_box_store --web-dir web --out web/public/research/historical-box-coverage.json
      - name: Publish historical six-model champion benchmark without modifying current model
        env:
          PYTHONPATH: research
        run: python -m forecast.model_championship --web-dir web --out web/public/research/model-championship.json
      - name: Evaluate independent Elo 2.0 across held-out prior-year historical games
        env:
          PYTHONPATH: research
        run: python -m forecast.elo_v2_historical --out web/public/research/elo-v2-historical.json
      - name: Publish paired historical Elo 3.0 versus Elo 2.0 held-out benchmark
        env:
          PYTHONPATH: research
        run: python -m forecast.elo_v3 --out web/public/research/elo-v3-historical.json
      - name: Validate and build 2027 NCAA-source results
        env:
          PYTHONPATH: research
        run: python -m forecast.live --model-report web/public/research/benchmark.json --out web/public/current/2027.json --games-out web/public/current/2027-games.json --box-out web/public/current/2027-box-games.json --espn-receipts-path web/public/forecasts/espn-final-receipts.json
      - name: Publish source-matched Elo 3.0 team rankings
        env:
          PYTHONPATH: research
        run: python -m forecast.elo_v3_current --games web/public/current/2027-games.json --ratings web/public/current/2027.json --boxes web/public/current/2027-box-games.json --out web/public/current/elo-v3-teams.json
      - name: Publish source-aligned Elo 2.0 shadow rankings and AP three-way research
        env:
          PYTHONPATH: research
        run: python -m forecast.elo_v2_current --games web/public/current/2027-games.json --ratings web/public/current/2027.json --previous web/public/seasons/2026.json --ap web/public/research/ap-poll-history.json --historical web/public/research/elo-v2-historical.json --out web/public/current/elo-v2-research.json
      - name: Retrain 2027 logistic model on earlier game dates and walk-forward score
        env:
          PYTHONPATH: research
        run: python -m forecast.retrain --games web/public/current/2027-games.json --ratings web/public/current/2027.json --ledger web/public/forecasts --out web/public/current/2027-online-model.json
      - name: Train source-linked previous-date efficiency and verified possessions research
        env:
          PYTHONPATH: research
        run: python -m forecast.possession_research --games web/public/current/2027-games.json --ratings web/public/current/2027.json --boxes web/public/current/2027-box-games.json --out web/public/current/efficiency-research.json
      - name: Evaluate date-frozen opponent-aware adjusted team strength
        env:
          PYTHONPATH: research
        run: python -m forecast.opponents --games web/public/current/2027-games.json --ratings web/public/current/2027.json --out web/public/current/2027-opponents.json
      - name: Fit causal Kalman-style latent team strength and evaluate prior days
        env:
          PYTHONPATH: research
        run: python -m forecast.state_space --games web/public/current/2027-games.json --ratings web/public/current/2027.json --out web/public/current/2027-state-space.json
      - name: Evaluate causal Bayesian and residual-stump challengers
        env:
          PYTHONPATH: research
        run: python -m forecast.challengers --games web/public/current/2027-games.json --ratings web/public/current/2027.json --out web/public/current/challengers.json
      - name: Run full date-frozen gradient-boosted CART and Bayesian Gaussian skill experiments
        env:
          PYTHONPATH: research
        run: python -m forecast.advanced_models --games web/public/current/2027-games.json --ratings web/public/current/2027.json --out web/public/current/advanced-models.json
      - name: Run source-only date-frozen score and margin forecasting benchmark
        env:
          PYTHONPATH: research
        run: python -m forecast.score_research --games web/public/current/2027-games.json --ratings web/public/current/2027.json --out web/public/current/score-research.json
      - name: Evaluate original first-pick ensemble evidence, without automatic promotion
        env:
          PYTHONPATH: research
        run: python -m forecast.forward_ensemble --ratings web/public/current/2027.json --ledger web/public/forecasts --out web/public/current/forward-ensemble.json
      - name: Publish verified archive operations and feed provenance
        env:
          PYTHONPATH: research
        run: python -m forecast.operations --ledger web/public/forecasts --out web/public/current/operations.json
      - name: Publish immutable-first-pick daily, weekly and experimental score accuracy research
        env:
          PYTHONPATH: research
        run: python -m forecast.accuracy_research --ledger web/public/forecasts --out web/public/current/accuracy-research.json
      - name: Build independently auditable settlement backlog report
        env:
          PYTHONPATH: research
        run: python -m forecast.settlement_health --ledger web/public/forecasts --out web/public/current/settlement-health.json
      - name: Summarize prospective first-pick error drift
        env:
          PYTHONPATH: research
        run: python -m forecast.drift --ledger web/public/forecasts/index.json --out web/public/current/drift.json
      - name: Assemble real upcoming ESPN fixtures with matchup reasons and prior-game evidence
        env:
          PYTHONPATH: research
        run: python -m forecast.gamecenter --games web/public/current/2027-games.json --ratings web/public/current/2027.json --online-model web/public/current/2027-online-model.json --state-space web/public/current/2027-state-space.json --opponent-model web/public/current/2027-opponents.json --ensemble-model web/public/current/forward-ensemble.json --out web/public/current/upcoming.json
      - name: Publish current-day ESPN-confirmed finals independently of lagging NCAA Elo
        env:
          PYTHONPATH: research
        run: python -m forecast.recent_finals --ratings web/public/current/2027.json --games web/public/current/2027-games.json --out web/public/current/recent-finals.json
      - name: Validate accepted-game totals and publish refresh provenance
        env:
          PYTHONPATH: research
        run: python -m forecast.freshness --input web/public/current/2027.json --out web/public/current/refresh-status.json
      - name: Verify immutable forecast audit before site publication
        env:
          PYTHONPATH: research
        run: python -m forecast.audit --dir web/public/forecasts
      - name: Publish archive health from actual immutable Git evidence
        env:
          PYTHONPATH: research
        run: python -m forecast.archive_health --ledger web/public/forecasts --out web/public/current/archive-health.json
      - name: Install frontend dependencies
        working-directory: web
        run: npm install --no-audit --no-fund
      - name: Validate snapshot
        working-directory: web
        run: npm run check:data
      - name: Generate static website
        working-directory: web
        env:
          NEXT_PUBLIC_BASE_PATH: /March-Madness-Forecasting26-27
        run: npm run build
      - name: Upload one named GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/out
      - name: Wait for Pages artifact metadata to become queryable
        # In the 2026-11-18 scheduled failure, upload succeeded and an
        # artifact existed, but deploy-pages immediately received NOT_FOUND.
        # Check the GitHub Actions artifact listing before invoking Pages.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            count="$(gh api "repos/${GH_REPO}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
              --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length' 2>/dev/null)" || count=""
            if [ "$count" = "1" ]; then
              echo "One Pages artifact visible on attempt $attempt."
              # Allow metadata replication into the Pages deployment API.
              sleep 12
              exit 0
            fi
            if [ "$count" != "" ] && [ "$count" != "0" ]; then
              echo "::error::Expected exactly one github-pages artifact; found $count"
              exit 1
            fi
            echo "Artifact metadata not ready ($attempt/18); retrying in 10 seconds."
            sleep 10
          done
          echo "::error::Pages artifact never became visible to the Actions API."
          exit 1
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Default GitHub API intermittently returns artifact NOT_FOUND even
          # after successful upload; keep ample retry room for transient errors.
          error_count: 20
          timeout: 900000
