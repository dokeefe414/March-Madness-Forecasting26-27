name: Archive real pre-tipoff forecasts
on:
  schedule:
    # 2:07 a.m. ET: settle previously frozen picks after overnight games.
    # 6:07 a.m. ET: recheck late West Coast finals and delayed NCAA results.
    # 9:07 a.m. ET: capture current-day pregame picks and retry pending settlements.
    # 4:07 p.m. ET: refresh future evening picks and settle available finals.
    # 10:07 p.m. ET: recheck verified finals and preserve evening source receipts.
    # A settled score is only published after ESPN STATUS_FINAL and matching NCAA scores.
    # Never retroactively labels a completed game a pregame forecast.
    # Separate cron entries make each capture independently visible, and
    # re-register the schedule after the 2026-11-18 missing archive runs.
    # The archive watchdog is a second, independent scheduled recovery path.
    - cron: "7 2 * 1,2,3,4,11,12 *"
      timezone: "America/New_York"
    - cron: "7 6 * 1,2,3,4,11,12 *"
      timezone: "America/New_York"
    - cron: "7 9 * 1,2,3,4,11,12 *"
      timezone: "America/New_York"
    - cron: "7 16 * 1,2,3,4,11,12 *"
      timezone: "America/New_York"
    # Capture newly available evening finals and current picks before midnight.
    # Never reconstruct a pretipoff pick for a game that already began.
    - cron: "7 22 * 1,2,3,4,11,12 *"
      timezone: "America/New_York"
    # Weekly Monday AP poll comparison after typical poll release, with
    # daily archive runs available to retry delayed poll publication.
    - cron: "7 18 * 1,2,3,4,11,12 1"
      timezone: "America/New_York"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/archive-pregame.yml"
permissions:
  contents: write
concurrency:
  group: march-forecast-pregame-ledger
  cancel-in-progress: false
jobs:
  archive:
    name: Capture scheduled pre-tipoff probabilities and settle prior forecasts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build source-verified, timestamped current ratings
        env:
          PYTHONPATH: research
        run: python -m forecast.live --out web/public/current/2027.json --games-out web/public/current/2027-games.json --save-espn-receipts --espn-receipts-path web/public/forecasts/espn-final-receipts.json
      # Real polls may tie at a ranking (e.g., two No.18 teams); the parser
      # preserves official competition-style positions and frozen week history.
      - name: Capture newly published AP Top 25 against pre-week Elo without changing forecasts
        env:
          PYTHONPATH: research
        run: python -m forecast.ap_poll --ratings web/public/current/2027.json --games web/public/current/2027-games.json --history web/public/research/ap-poll-history.json
      - name: Chronologically retrain current-season model before fixture snapshot
        env:
          PYTHONPATH: research
        run: python -m forecast.retrain --games web/public/current/2027-games.json --ratings web/public/current/2027.json --ledger web/public/forecasts --out web/public/current/2027-online-model.json
      - name: Refit opponent-adjusted research challenger on prior-day scored games
        env:
          PYTHONPATH: research
        run: python -m forecast.opponents --games web/public/current/2027-games.json --ratings web/public/current/2027.json --out web/public/current/2027-opponents.json
      - name: Recompute source-linked causal state-space challenger for audit
        env:
          PYTHONPATH: research
        run: python -m forecast.state_space --games web/public/current/2027-games.json --ratings web/public/current/2027.json --out web/public/current/2027-state-space.json
      - name: Fit conservative independent first-pick forward ensemble shadow
        env:
          PYTHONPATH: research
        run: python -m forecast.forward_ensemble --ratings web/public/current/2027.json --ledger web/public/forecasts --out web/public/current/forward-ensemble.json
      - name: Snapshot future ESPN fixtures only and settle past NCAA finals
        env:
          PYTHONPATH: research
        run: python -m forecast.snapshot --ratings web/public/current/2027.json --games web/public/current/2027-games.json --online-model web/public/current/2027-online-model.json --state-space web/public/current/2027-state-space.json --opponent-model web/public/current/2027-opponents.json --ensemble-model web/public/current/forward-ensemble.json --out-dir web/public/forecasts
      - name: Audit source timestamps, forecast buffer and score arithmetic
        env:
          PYTHONPATH: research
        run: python -m forecast.audit --dir web/public/forecasts
      - name: Commit immutable, public ledger entries
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/forecasts web/public/research/ap-poll-history.json
          if git diff --cached --quiet; then
            echo "No new verified forecasts, settlements or AP poll editions to archive."
          else
            git commit -m "Archive verified first picks, settlements and AP poll editions [skip ci]"
            # Retain the immutable snapshot files and never force-push.
            # A concurrent source/documentation commit can legitimately race this job.
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then exit 0; fi
              echo "Push raced with main; safely rebasing before retry $attempt"
              git fetch origin main
              git rebase origin/main || { git rebase --abort; exit 1; }
            done
            echo "Failed to commit archive after three non-force attempts" >&2
            exit 1
          fi
