name: CI
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
jobs:
  research:
    name: Python research unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test forecasting models and CSV handling
        env:
          PYTHONPATH: research
        run: python -m unittest discover -s research/tests -v
      - name: Fetch real season NCAA games and paired team boxes
        env:
          PYTHONPATH: research
        run: python -m forecast.live --out research/outputs/live-ratings.json --games-out research/outputs/live-games.json --box-out research/outputs/live-paired-boxes.json --skip-espn
      - name: Evaluate source-backed date-frozen latent and ensemble models
        env:
          PYTHONPATH: research
        run: python -m forecast.efficiency_latent --games research/outputs/live-games.json --ratings research/outputs/live-ratings.json --boxes research/outputs/live-paired-boxes.json --out research/outputs/live-efficiency-latent-benchmark.json
      - name: Generate real-current Elo 3 power rankings and paired Elo 2 shadow audit
        env:
          PYTHONPATH: research
        run: |
          python -m forecast.elo_v3_current --games research/outputs/live-games.json --ratings research/outputs/live-ratings.json --boxes research/outputs/live-paired-boxes.json --out research/outputs/live-elo3-power.json
          python - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path("research/outputs/live-elo3-power.json").read_text())
          ratings=json.loads(Path("research/outputs/live-ratings.json").read_text())
          assert result["sourceGames"]==ratings["regularSeasonGames"]
          assert len(result["teams"])==len(ratings["teams"])
          assert all(t["components"]["power"]==round(t["rating"],4) or abs(t["components"]["power"]-t["rating"])<.01 for t in result["teams"])
          assert result["currentRetrospective"]["sourceGames"]==result["sourceGames"]
          assert result["currentRetrospective"]["elo2"]["games"]==result["sourceGames"]
          assert result["currentRetrospective"]["elo3"]["games"]==result["sourceGames"]
          print("Current Elo3 source integrity:",len(result["teams"]),"teams; source-matched games:",result["sourceGames"])
          PY
      - name: Upload real-season model comparison and source coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-season-efficiency-latent-benchmark
          path: |
            research/outputs/live-ratings.json
            research/outputs/live-games.json
            research/outputs/live-paired-boxes.json
            research/outputs/live-efficiency-latent-benchmark.json
            research/outputs/live-elo3-power.json
          if-no-files-found: warn
      - name: Evaluate six-factor Elo 3.0 against production Elo on historical seasons
        env:
          PYTHONPATH: research
        run: python -m forecast.elo_v3 --out research/outputs/elo3-historical.json
      - name: Upload Elo 3.0 historical comparison
        uses: actions/upload-artifact@v4
        with:
          name: elo3-historical-comparison
          path: research/outputs/elo3-historical.json
          if-no-files-found: error
      - name: Test nightly source quality and date guards
        env:
          PYTHONPATH: research
        run: python -m unittest discover -s research/tests -p "test_freshness.py" -v
      - name: Verify chronological in-season training and future-only picks
        env:
          PYTHONPATH: research
        run: python -m unittest discover -s research/tests -p "test_retrain.py" -v
      - name: Verify forward first-pick research report derives solely from immutable files
        env:
          PYTHONPATH: research
        run: python -m forecast.accuracy_research --ledger web/public/forecasts --out research/outputs/accuracy-research.json
      - name: Audit any committed pregame forecast ledger
        env:
          PYTHONPATH: research
        run: python -m forecast.audit --dir web/public/forecasts
      - name: Evaluate held-out tournament seasons
        env:
          PYTHONPATH: research
        run: python -m forecast.benchmark --web-dir web --out research/outputs/rolling-benchmark.json
      - name: Audit source-pinned historical training rows and nested walk-forward evaluation
        env:
          PYTHONPATH: research
        run: python -m forecast.historical_dataset --web-dir web --manifest research/outputs/historical-data-manifest.json --evaluation research/outputs/historical-evaluation.json --rows research/outputs/historical-training-rows.jsonl
      - name: Run prior-season probabilistic score model, calibration and ensemble comparison
        env:
          PYTHONPATH: research
        run: python -m forecast.historical_probabilistic --web-dir web --out research/outputs/historical-probabilistic.json
      - name: Run source-audited historical NCAA box-score coverage and Four Factors pipeline
        env:
          PYTHONPATH: research
        run: python -m forecast.historical_box_store --web-dir web --out research/outputs/historical-box-coverage.json
      - name: Benchmark six historical ML challengers on matched unseen tournament seasons
        env:
          PYTHONPATH: research
        run: python -m forecast.model_championship --web-dir web --out research/outputs/model-championship.json
      - name: Upload reproducible source coverage and historical ML championship
        uses: actions/upload-artifact@v4
        with:
          name: v20-source-audited-model-championship
          path: |
            research/outputs/historical-box-coverage.json
            research/outputs/model-championship.json
          if-no-files-found: error
      - name: Store score uncertainty, calibration and nested ensemble historical evaluation
        uses: actions/upload-artifact@v4
        with:
          name: historical-probabilistic-evaluation
          path: research/outputs/historical-probabilistic.json
          if-no-files-found: error
      - name: Store historical source provenance and chronological evaluation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: audited-historical-model-dataset
          path: |
            research/outputs/historical-data-manifest.json
            research/outputs/historical-evaluation.json
            research/outputs/historical-training-rows.jsonl
          if-no-files-found: error
      - name: Store reproducible benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: rolling-tournament-benchmark
          path: research/outputs/rolling-benchmark.json
          if-no-files-found: error
  website:
    name: Typecheck and build website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run check:data
      - run: npm run test:bracket
      - run: npm run test:score
      - run: npm run typecheck
      - run: npm run build

  browser:
    name: Browser E2E and responsive visual smoke checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Real browser navigation, bracket, mobile and accessibility smoke tests
        run: npm run test:e2e
      - name: Preserve visual smoke screenshots and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-v06-visual-checks
          path: |
            web/test-results
            web/playwright-report
          if-no-files-found: warn

  pages-history:
    name: Historical tournament loading at production Pages prefix
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      # Exercise the exact public project subpath, not only the local '/' page.
      NEXT_PUBLIC_BASE_PATH: /March-Madness-Forecasting26-27
      E2E_PAGES_BASE: /March-Madness-Forecasting26-27
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Verify historical seasons, tournament JSON and real field limitations
        run: npx playwright test e2e/historical-pages.spec.ts
      - name: Preserve source-backed historical browser failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-historical-browser-checks
          path: |
            web/test-results
            web/playwright-report
          if-no-files-found: warn
